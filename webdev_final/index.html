<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webdev_Finals - Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        /* Custom styling to match wireframe elements */
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-header {
            background-color: #ffffff;
            border-bottom: 2px solid #e0e0e0;
            padding: 15px 20px;
        }
        .sidebar {
            background-color: #ffffff;
            min-height: calc(100vh - 75px);
            border-right: 2px solid #e0e0e0;
            padding: 20px 0;
        }
        .sidebar .nav-link {
            color: #333333;
            padding: 12px 20px;
            font-weight: 500;
            border-bottom: 1px solid #f0f0f0;
        }
        .sidebar .nav-link:hover {
            background-color: #f8f9fa;
            color: #1976d2;
        }
        .sidebar .nav-link.active-page {
            color: #dc3545 !important; /* Red highlight from wireframe */
            font-weight: bold;
            background-color: #fff5f5;
        }
        .sub-category {
            padding-left: 35px !important;
            font-size: 14px;
            background-color: #fafafa;
        }
        .sub-category.active-sub {
            color: #dc3545 !important;
            font-weight: bold;
        }
        /* Custom Content Cards */
        .ad-banner {
            background-color: #ffffff;
            border: 2px dashed #b0bec5;
            border-radius: 8px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-download-box {
            background-color: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px;
            height: 350px;
        }
        .store-btn {
            border: 2px solid #333;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }
        .store-btn:hover {
            background-color: #f0f0f0;
        }
        .product-placeholder {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
    </style>
</head>
<body>

    <header class="main-header sticky-top">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
    <a href="index.html" class="d-flex align-items-center text-decoration-none">
        <img src="logo.png" alt="Lazada Logo" style="height: 60px; width: auto; object-fit: contain;">
        <span class="logo-text ms-2"></span>
    </a>
</div>
            
            <div class="w-50 mx-4">
                <div class="input-group">
                    <input type="text" class="form-control" placeholder="Search in Lazada...">
                    <button class="btn btn-outline-secondary" type="button">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </div>

            <div class="d-flex align-items-center gap-4">
                <a href="#" class="text-dark position-relative">
                    <i class="fa-solid fa-cart-shopping fs-4"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
                <button class="btn btn-outline-dark px-4">Profile</button>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse shadow-sm">
                <div class="position-sticky flex-column d-flex">
                    <a class="nav-link active-page" href="index.html">Homepage</a>
                    <a class="nav-link" href="about.html">About Page</a>
                    
                    <a class="nav-link d-flex justify-content-between align-items-center" href="category-electric.html">
                        Categories <span>▲</span>
                    </a>
                    <a class="nav-link sub-category" href="category-electric.html">Electric Devices</a>
                    <a class="nav-link sub-category" href="category-home.html">Home & Living</a>
                    <a class="nav-link sub-category" href="category-fashion.html">Fashion & Accessories</a>
                </div>
            </nav>

            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="row g-4 mb-4">
                    <div class="col-lg-8">
                        <div class="ad-banner shadow-sm text-center">
                            <div>
                                <h1 class="display-4 fw-bold text-muted">Sale Advertisement Example</h1>
                                <p class="text-secondary">Interactive Promotional Content Window</p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-lg-4">

                                    Apple Store
                                </div>
                            </a>
                            <a href="#" class="store-btn">
                                <i class="fa-brands fa-google-play fs-3 me-3"></i>
                                <div class="text-start">
                                    <small class="d-block text-muted fw-normal" style="font-size: 10px;">Get it on</small>
                                    Google Play
                                </div>
                            </a>
                        </div>
                    </div>
                </div>

                <h3 class="mb-3 mt-5 text-secondary">Featured Products</h3>
                <div class="row g-3">
                    <div class="col-md-4"><div class="product-placeholder shadow-sm">Ex. Product Card</div></div>
                    <div class="col-md-4"><div class="product-placeholder shadow-sm">Ex. Product Card</div></div>
                    <div class="col-md-4"><div class="product-placeholder shadow-sm">Ex. Product Card</div></div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
